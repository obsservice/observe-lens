[project]
name = "observability-mcp-gateway"
version = "0.1.0"
description = "ObserveLens Observability MCP Gateway"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastmcp>=2.0,<3.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "httpx>=0.28,<1.0",
  "structlog>=24.4,<26.0",
  "tenacity>=9.0,<10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
  "mypy>=1.13,<2.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/observability_mcp_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["observability_mcp_gateway"]
