services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: observelens_auth
      POSTGRES_USER: observelens
      POSTGRES_PASSWORD: observelens
    ports:
      - "5433:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U observelens -d observelens_auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    build: .
    environment:
      AUTH_DATABASE_URL: postgresql+asyncpg://observelens:observelens@postgres:5432/observelens_auth
      AUTH_JWT_SECRET: local-development-secret-change-before-production
    ports:
      - "9081:9081"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn observelens_auth.main:app --host 0.0.0.0 --port 9081"

volumes:
  auth-postgres-data:
