        retrieval_log_id:
          $ref: "#/components/schemas/UUID"
        chunk_id:
          $ref: "#/components/schemas/UUID"
        rating:
          type: integer
          minimum: 1
          maximum: 5
        feedback_type:
          $ref: "#/components/schemas/RetrievalFeedbackType"
        comment:
          type: string
          nullable: true
        created_by:
          type: integer
          format: int64
        created_at:
