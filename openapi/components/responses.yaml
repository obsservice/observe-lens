BadRequest:
  description: Invalid request.
  content: { application/json: { schema: { $ref: ../schemas/common.yaml#/ErrorResponse } } }
Unauthorized:
  description: Authentication failed or is required.
  content: { application/json: { schema: { $ref: ../schemas/common.yaml#/ErrorResponse } } }
NotFound:
  description: Resource not found.
  content: { application/json: { schema: { $ref: ../schemas/common.yaml#/ErrorResponse } } }
Conflict:
  description: Request conflicts with current resource state.
  content: { application/json: { schema: { $ref: ../schemas/common.yaml#/ErrorResponse } } }
ResourceAlreadyExists:
  description: Resource already exists.
  content:
    application/json:
      schema:
        $ref: ../schemas/common.yaml#/ErrorResponse
      examples:
        duplicateName:
          summary: Duplicate resource name
          value:
            code: RESOURCE_ALREADY_EXISTS
            message: Incident integration with name "Grafana prod" already exists
            request_id: req-1
            details: {}
