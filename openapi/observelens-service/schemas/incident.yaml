IncidentSeverity: { type: string, enum: [Critical, Error, Warn] }
IncidentStatus: { type: string, enum: [Open, Acknowledged, Investigating, Recovering, Resolved, Closed, Archived] }
Incident:
  type: object
  required: [id, name, severity, status, source, created_at, updated_at]
  properties:
    id: { type: integer, minimum: 10000000, maximum: 99999999 }
    name: { type: string }
    description: { type: string, nullable: true }
    severity: { $ref: '#/IncidentSeverity' }
    status: { $ref: '#/IncidentStatus' }
    source: { type: string }
    labels: { type: object, additionalProperties: { type: string } }
    started_at: { $ref: common.yaml#/Timestamp, nullable: true }
    resolved_at: { $ref: common.yaml#/Timestamp, nullable: true }
    created_at: { $ref: common.yaml#/Timestamp }
    updated_at: { $ref: common.yaml#/Timestamp }
WebhookIncidentRequest:
  type: object
  required: [title]
  properties:
    title: { type: string, maxLength: 256 }
    description: { type: string }
    severity: { $ref: '#/IncidentSeverity', default: Warn }
    source: { type: string, nullable: true, description: Optional. Defaults to integration name when empty; when provided, it must match the integration name resolved by integration_id. }
    started_at: { $ref: common.yaml#/Timestamp }
    labels: { type: object, additionalProperties: { type: string } }
AlertmanagerAlert:
  type: object
  properties:
    status: { type: string }
    labels: { type: object, additionalProperties: { type: string } }
    annotations: { type: object, additionalProperties: { type: string } }
    startsAt: { $ref: common.yaml#/Timestamp }
    endsAt: { $ref: common.yaml#/Timestamp }
AlertmanagerWebhookRequest:
  type: object
  properties:
    receiver: { type: string }
    status: { type: string }
    source: { type: string, nullable: true, description: Optional. Defaults to integration name when empty; when provided, it must match the integration name resolved by integration_id. }
    alerts: { type: array, items: { $ref: '#/AlertmanagerAlert' } }
    groupLabels: { type: object, additionalProperties: { type: string } }
    commonLabels: { type: object, additionalProperties: { type: string } }
    commonAnnotations: { type: object, additionalProperties: { type: string } }
    externalURL: { type: string }
IncidentUpdateRequest:
  type: object
  minProperties: 1
  properties:
    name: { type: string, maxLength: 200 }
    description: { type: string }
    severity: { $ref: '#/IncidentSeverity' }
    status: { $ref: '#/IncidentStatus' }
IncidentPage:
  allOf: [{ $ref: common.yaml#/PagedResult }, { type: object, properties: { items: { type: array, items: { $ref: '#/Incident' } } } }]
IncidentIntegration:
  type: object
  required: [id, name, type, status, webhook_url, token, created_at]
  properties:
    id: { $ref: common.yaml#/UUID }
    name: { type: string }
    type: { type: string, enum: [Webhook, Alertmanager] }
    status: { type: string, enum: [Enabled, Disabled] }
    webhook_url: { type: string, example: /api/v1/incidents/integrations/Webhook/12345678/webhook }
    token: { type: string, description: Plaintext integration token }
    token_hint: { type: string, description: Masked token retained for compatibility }
    created_at: { $ref: common.yaml#/Timestamp }
    updated_at: { $ref: common.yaml#/Timestamp }
IntegrationCreateRequest:
  type: object
  required: [name]
  properties:
    name: { type: string }
    type: { type: string, enum: [Webhook, Alertmanager], default: Webhook }
    status: { type: string, enum: [Enabled, Disabled], default: Enabled }
IntegrationUpdateRequest:
  type: object
  minProperties: 1
  properties:
    name: { type: string }
    type: { type: string, enum: [Webhook, Alertmanager] }
    status: { type: string, enum: [Enabled, Disabled] }
