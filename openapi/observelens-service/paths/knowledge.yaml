proxyPath:
  summary: Knowledge Base reverse proxy
  description: |
    Catch-all reverse proxy for observelens-knowledge-base.

    This gateway path forwards `/api/v1/knowledge/**` requests to
    observelens-knowledge-base and does not define Knowledge business
    request/response schemas in observelens-service.

    Concrete Knowledge API contracts are maintained by:
    `openapi/observelens-knowledge-base/openapi.yaml`.
  x-observelens-proxy: true
  x-observelens-upstream-service: observelens-knowledge-base
  x-observelens-upstream-openapi: ../observelens-knowledge-base/openapi.yaml
  x-observelens-supported-methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
    - HEAD
  parameters:
    - $ref: ../components/parameters.yaml#/TenantId
    - $ref: ../components/parameters.yaml#/UserId
    - $ref: ../components/parameters.yaml#/RequestId
    - name: path
      in: path
      required: true
      description: Knowledge Base API path suffix to proxy.
      schema:
        type: string
  get:
    tags: [Knowledge]
    summary: Proxy Knowledge Base requests
    description: |
      Documentation placeholder for the catch-all Knowledge proxy.

      The runtime gateway accepts GET, POST, PUT, PATCH, DELETE, OPTIONS and
      HEAD on this path. Concrete Knowledge API contracts are maintained by:
      `openapi/observelens-knowledge-base/openapi.yaml`.
    operationId: proxyKnowledgeRequests
    responses:
      default:
        description: Response proxied from observelens-knowledge-base. See upstream OpenAPI.
